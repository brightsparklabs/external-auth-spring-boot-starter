# Keycloak for the example application's jwt-keycloak profile.
#
# Start:  docker compose -f example-app/docker/compose.yaml up -d
# Stop:   docker compose -f example-app/docker/compose.yaml down
#
# The admin console is at http://localhost:8180 (admin / admin).
# The "example" realm is imported from ./keycloak on first start.

name: external-auth-example

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
